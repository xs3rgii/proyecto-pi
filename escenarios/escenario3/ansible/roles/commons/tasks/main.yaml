- name: Actualizar el sistema y los paquetes
  apt:
    update_cache: yes
    upgrade: yes
    cache_valid_time: 3600

- name: Añadir las entradas de la red interna al fichero /etc/hosts
  blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE RED INTERNA"
    block: |
      10.0.0.2 mariadb.example.org
      10.0.0.1 apache2.example.org
    owner: root
    group: root
    mode: '0644'

- name: Añadir dominio 2048 al /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ ansible_host }}   www.local2048.org"
    state: present
