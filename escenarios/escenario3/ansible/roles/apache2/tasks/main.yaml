- name: Instalar paquetes necesarios para LAMP (Apache, PHP)
  apt:
    name:
      - apache2
      - php
      - libapache2-mod-php
      - php-mysql
      - php-mbstring
      - git
    state: present
    update_cache: yes

- name: Activar modulos de apache2
  community.general.apache2_module:
    state: present
    name: "{{ item }}"
  loop: "{{ mods_enabled }}"
  notify: restart apache2

- name: Configuración de virtualhost
  template: 
    src: etc/apache2/vhost.j2
    dest: /etc/apache2/sites-available/{{ item.name }}.conf
    owner: root
    group: root
  loop: "{{ virtualhosts }}"

- name: Crear DocumentRoot si no existe
  ansible.builtin.file:
    path: "{{ item.datos.documentroot }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  loop: "{{ virtualhosts }}"

- name: Activación de los VirtualHost
  file:
    src: /etc/apache2/sites-available/{{ item.name }}.conf
    dest: /etc/apache2/sites-enabled/{{ item.name }}.conf
    state: link
  loop: "{{ virtualhosts }}"
  notify: restart apache2

- name: Copiar aplicación Guestbook
  ansible.builtin.copy:
    src: app/
    dest: "{{ guestbook_base_web_path }}/"
    owner: www-data
    group: www-data
    mode: '0644'
    directory_mode: '0755'

- name: Crear fichero de configuración config.php dentro de la aplicación
  ansible.builtin.template:
    src: config.php.j2
    dest: "{{ guestbook_base_web_path }}/config.php"
    owner: www-data
    group: www-data

- name: Activar módulos proxy para 2048
  apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - proxy
    - proxy_http

- name: Crear VirtualHost 2048
  template:
    src: 2048.conf.j2
    dest: /etc/apache2/sites-available/2048.conf

- name: Activar VirtualHost 2048
  command: a2ensite 2048.conf
  args:
    creates: /etc/apache2/sites-enabled/2048.conf

