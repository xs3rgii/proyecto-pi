- name: Instalar Docker (si no está instalado)
  apt:
    name: docker.io
    state: present
    update_cache: yes

- name: Habilitar y arrancar el servicio Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Crear grupo docker si no existe
  group:
    name: docker
    state: present

- name: Añadir usuario normal al grupo docker
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

- name: Asegurar que /var/run/docker.sock pertenece al grupo docker
  file:
    path: /var/run/docker.sock
    group: docker
    mode: '0660'

- name: Crear y arrancar contenedor 2048
  community.docker.docker_container:
    name: juego2048
    image: josedom24/2048:v1
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "8080:80"
